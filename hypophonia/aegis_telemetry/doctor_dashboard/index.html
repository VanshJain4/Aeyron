<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis — Hypophonia dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem 2rem; }
    h1 { margin-bottom: 0.5rem; }
    .controls { margin-bottom: 1rem; }
    .controls input { margin-right: 0.5rem; padding: 0.25rem 0.5rem; }
    .controls button { padding: 0.25rem 0.75rem; }
    #chartWrap { max-width: 800px; height: 400px; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Aegis — Hypophonia dashboard</h1>
  <p>Anomaly score over time (from Vultr ML server).</p>
  <div class="controls">
    <label>API base URL <input type="text" id="baseUrl" value="http://140.82.11.174:8000" placeholder="Vultr ML server" size="40" /></label>
    <label>Patient ID <input type="text" id="patientId" value="default" placeholder="default" /></label>
    <button id="fetchBtn">Load history</button>
  </div>
  <p id="error" class="error" style="display:none;"></p>
  <div id="chartWrap"><canvas id="chart"></canvas></div>
  <script src="app.js"></script>
</body>
</html>
